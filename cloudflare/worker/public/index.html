<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg">
<link rel="apple-touch-icon" href="/icon.svg">
<title>Comp Manager</title>
<style>
*{box-sizing:border-box}
:root{--bg:#f1f5f9;--card:#fff;--ink:#0f172a;--mute:#64748b;--brand:#2563eb;--bad:#dc2626;--good:#16a34a;--line:#e2e8f0}
body{margin:0;font:1rem/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);-webkit-text-size-adjust:100%}
header{position:sticky;top:0;z-index:10;background:#0f172a;color:#fff;display:flex;align-items:center;gap:10px;padding:10px 12px;padding-top:calc(10px + env(safe-area-inset-top))}
header{flex-wrap:wrap}header h1{font-size:1.0625rem;margin:0;flex:1;min-width:0;overflow-wrap:anywhere}
header button{background:#1e293b;color:#fff;border:0;border-radius:8px;padding:8px 12px;font-size:1rem}
#quick{display:flex;gap:8px;overflow-x:auto;padding:8px 12px;background:#e2e8f0}
#quick:empty{display:none}
#quick button{flex:0 0 auto;border:0;background:#fff;border-radius:16px;padding:6px 12px;font-size:0.875rem}
main{max-width:900px;margin:0 auto;padding:12px;padding-bottom:calc(24px + env(safe-area-inset-bottom))}
.card{background:var(--card);border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.08)}
h2{margin:4px 0 12px;font-size:1.25rem}
label{display:block;font-size:0.8125rem;color:var(--mute);margin:10px 0 4px}
input,select,textarea{width:100%;padding:12px;font-size:1rem;border:1px solid #cbd5e1;border-radius:8px;background:#fff;color:var(--ink)}
button.b{background:var(--brand);color:#fff;border:0;border-radius:8px;padding:12px 16px;font-size:1rem;margin:4px 4px 4px 0}
button.b.alt{background:#475569}button.b.bad{background:var(--bad)}button.b.ok{background:var(--good)}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1 1 9rem;min-width:0}
.item{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;padding:12px 0;border-bottom:1px solid var(--line)}
.item:last-child{border:0}.item .t{flex:1 1 12rem;min-width:0;overflow-wrap:anywhere}.item .s{color:var(--mute);font-size:0.8125rem}
.item .t b{display:block;overflow-wrap:anywhere}
.item .grip{touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none;font-size:1.375rem;padding:6px 10px;color:var(--mute)}.item.drag{background:#e8f0fe;opacity:.85}.mv{display:flex;flex-direction:column;gap:4px;flex:0 0 auto}.mv .b{width:2.4rem;min-width:0;height:2rem;margin:0;padding:0;font-size:0.8125rem;line-height:1}.item .t{min-width:0;flex:1 1 auto}
.pos{color:var(--good)}.neg{color:var(--bad)}
.err{background:#fee2e2;color:#991b1b;padding:10px;border-radius:8px;margin-bottom:10px}
.msg{background:#dcfce7;color:#166534;padding:10px;border-radius:8px;margin-bottom:10px}
img,table{max-width:100%}table{width:100%;border-collapse:collapse;font-size:0.875rem}th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
td.r,th.r{text-align:right}.scroll{overflow-x:auto}
.chk{display:flex;align-items:center;gap:8px;margin:6px 0}.chk input{width:auto}
#drawer{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20;display:none}
#drawer.open{display:block}
#drawer nav{background:#fff;width:min(19rem,85vw);height:100%;overflow-y:auto;padding:12px;padding-top:calc(12px + env(safe-area-inset-top))}
#drawer .nv{display:flex;align-items:center;border-bottom:1px solid var(--line)}
#drawer .nv button.go{flex:1;text-align:left;background:none;border:0;padding:14px 4px;font-size:1.0625rem}
#drawer .nv button.star{background:none;border:0;font-size:1.375rem;color:#f59e0b;padding:8px}
.hide{display:none}
.vs{margin:14px 0;padding:10px;border:1px solid var(--line);border-radius:10px}
.vh{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px}
.vl{font-weight:700}.vo{font-size:1.25rem;font-weight:700;color:var(--brand);overflow-wrap:anywhere}
.vs input[type=range]{padding:0;border:0;margin:10px 0;height:2rem}
.vt{display:grid;grid-template-columns:repeat(auto-fit,minmax(3.6rem,1fr));gap:4px}
.vt button{border:1px solid #cbd5e1;background:#fff;border-radius:6px;padding:6px 2px;font-size:0.8125rem;min-width:0;overflow-wrap:anywhere;color:var(--ink)}
.vt button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.vs.chemistry .vt button{background:var(--swatch);color:#111827;border-color:#475569;font-weight:600;min-height:44px}
.vs.chemistry .vt button.on{outline:3px solid #111827;outline-offset:1px;text-decoration:underline}
.vs.chemistry input[type=range]{appearance:none;-webkit-appearance:none;background:transparent;height:32px}
.vs.chemistry input[type=range]::-webkit-slider-runnable-track{height:14px;border:1px solid #475569;border-radius:8px;background:var(--chemistry-scale)}
.vs.chemistry input[type=range]::-moz-range-track{height:14px;border:1px solid #475569;border-radius:8px;background:var(--chemistry-scale)}
.vs.chemistry input[type=range]::-webkit-slider-thumb{appearance:none;-webkit-appearance:none;width:26px;height:26px;margin-top:-7px;border:3px solid #111827;border-radius:50%;background:#fff}
.vs.chemistry input[type=range]::-moz-range-thumb{width:20px;height:20px;border:3px solid #111827;border-radius:50%;background:#fff}
.vs.chemistry input[type=range]:focus-visible{outline:3px solid var(--brand);outline-offset:3px}
.vrec{font-weight:400;color:var(--mute)}
.vphoto img{display:block;max-width:100%;max-height:60vh;border-radius:8px;border:1px solid var(--line)}.vphoto:empty{display:none}
.vnow{font-size:1.125rem;font-weight:700;overflow-wrap:anywhere}
#printarea{display:none}
@media print{body>*:not(#printarea){display:none!important}#printarea{display:block}}
@media(min-width:62em){#drawer{display:block;position:fixed;right:auto;width:15rem;background:none;inset:0 auto 0 0;top:4rem}
 #drawer nav{width:15rem}#menuBtn{display:none}body.authed main,body.authed #quick{margin-left:16rem;max-width:none}}
button.b{max-width:100%}.card{overflow-wrap:anywhere}
.reader-row{border:1px solid var(--line);border-radius:10px;padding:12px;margin:12px 0;min-width:0}.reader-row pre{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit;font-size:.875rem;background:var(--bg);padding:8px;border-radius:6px}.reader-row input[type=checkbox]{width:auto;min-width:1.2rem;min-height:1.2rem}button:disabled{opacity:.55;cursor:not-allowed}
.record-scroll{overflow:auto;max-width:100%;border:1px solid #cbd5e1;border-radius:8px;margin:12px 0}
.record-table{min-width:42rem;font-size:1rem;border-collapse:separate;border-spacing:0}
.record-table th{background:#e2e8f0;color:var(--ink);font-weight:700;white-space:nowrap}
.record-table th,.record-table td{padding:10px 12px;border-right:1px solid var(--line);vertical-align:top}
.record-table tbody tr:nth-child(even){background:#f8fafc}.record-table tbody tr:hover{background:#eff6ff}
.record-table td{overflow-wrap:anywhere}.record-table .r{white-space:nowrap;font-variant-numeric:tabular-nums}
.record-table .b{margin:2px;padding:8px 12px}.record-table input,.record-table select,.record-table textarea{min-width:9rem;padding:8px}
.record-table label{margin:4px 0}.record-table .chk{white-space:normal}.record-table input[type=checkbox]{min-width:1.2rem;width:auto}
.record-table .reader-row{border:0;border-radius:0;padding:0;margin:0}.reader-table{min-width:88rem}
.record-table.ex-table{min-width:0;width:100%}.ex-lines{table-layout:fixed}.ex-lines th:nth-child(1),.ex-lines th:nth-child(2){width:4.5rem}.ex-lines th:nth-child(3){width:22%}.ex-lines th:nth-child(5){width:7.5rem}.ex-lines th{white-space:normal}
.ex-total{margin:12px 0;padding:12px;border:2px solid var(--line);border-radius:10px;text-align:center}.ex-grand{font-size:2rem;font-weight:700;font-variant-numeric:tabular-nums}
.ex-kw-list{list-style:none;padding:0;display:flex;flex-wrap:wrap;gap:8px}.ex-kw-list li{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:2px 2px 2px 12px}.ex-kw-check{display:flex;align-items:center;gap:6px;margin:0;min-height:44px;cursor:pointer}.ex-kw-check input{width:1.3rem;height:1.3rem;margin:0}.ex-kw-bulk .b{flex:0 1 auto}
.reader-table td:nth-child(4){min-width:18rem}.reader-table td:last-child{min-width:24rem}
.reader-table pre{white-space:pre-wrap;font:inherit;margin:6px 0}.reader-table [data-reason]{margin:4px 0}
.quote-lines{min-width:60rem}.record-date{white-space:nowrap;font-variant-numeric:tabular-nums}
.record-scroll:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.visits-customers{min-width:0;width:100%;table-layout:fixed}
.visits-customers th,.visits-customers td{padding:8px 4px;white-space:normal;overflow-wrap:anywhere}
.visits-customers th:nth-child(1){width:12%}.visits-customers th:nth-child(2){width:38%}
.visits-customers th:nth-child(3){width:24%}.visits-customers th:nth-child(4){width:26%}
.visits-customers .b{width:100%;min-height:44px;margin:0;padding:8px 2px;white-space:normal;overflow-wrap:anywhere}
#sr-picker{width:36rem;max-width:calc(100vw - 24px);max-height:85vh;overflow:auto;border:1px solid var(--line);border-radius:12px;color:var(--ink);overflow-wrap:anywhere}
#sr-picker::backdrop{background:rgba(0,0,0,.5)}#sr-matches .b{display:block;width:100%;white-space:normal;overflow-wrap:anywhere;text-align:left}
</style>
</head>
<body>
<header><button id="menuBtn" class="hide">&#9776;</button><h1 id="title">Comp Manager</h1><button id="logout" class="hide">Log out</button></header>
<div id="quick"></div>
<div id="drawer"><nav id="nav"></nav></div>
<main id="app"></main>
<div id="printarea"></div>
<script>
"use strict";
var DAYS=["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];
var PERMS=[["canViewCustomerDetails","View customer details"],["canViewCustomers","View customers"],["canViewStatements","View statements"],["canViewRevenueSummary","View revenue summary"],["canViewPdf","View PDF settings"],["canEditCustomers","Edit customers"],["canEditStatements","Edit statements"],["canEditPdf","Edit PDF settings"],["canAccessVisits","Access visits"],["canAccessSalesQuote","Access Sales Quote"],["canAccessStatementReader","Access Statement Reader"],["canAccessExpenses","Access Expenses"]];
var DEF_CREDIT="payment, paid, credit, refund, discount, adjustment, rebate, deposit, return, transfer in, check, cheque";
var DEF_DEBIT="cash, bill, charge, service, invoice, fee, debit, purchase, due, owed, repair, labor, parts, materials";
var S={token:localStorage.getItem("cm.token")||"",account:JSON.parse(localStorage.getItem("cm.account")||"null"),view:"",arg:null,kw:null,master:false};
var app=document.getElementById("app");

function mapLink(c){var a=[c.address,c.city,c.state,c.zip].filter(Boolean).join(", ");if(!a.trim())return "";return '<a href="https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(a)+'" target="_blank" rel="noopener" style="color:inherit;text-decoration:underline">'+esc(a)+'</a>'}
function esc(v){return String(v==null?"":v).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function money(n){n=Number(n)||0;return (n<0?"-":"")+"$"+Math.abs(n).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2})}
function $(id){return document.getElementById(id)}
function recordTable(headers,body,caption,extra){
  return '<div class="record-scroll" role="region" aria-label="'+esc(caption)+'" tabindex="0"><table class="record-table '+(extra||"")+'"><caption style="text-align:left;padding:8px 12px;font-weight:700">'+esc(caption)+'</caption><thead><tr>'+headers.map(function(h){return '<th scope="col">'+esc(h)+'</th>'}).join("")+'</tr></thead><tbody>'+body+'</tbody></table></div>';
}
function customerTable(rows,actions,reorder,visits){
  return recordTable(visits?["Order","Customer","Service day","Actions"]:["Order","Customer","ID","Service day","Address","Monthly charge","Actions"],rows.map(function(c){
    return '<tr data-id="'+esc(c.customer_id)+'"><td>'+esc(c.route_order||"")+(reorder?'<span class="mv"><button class="b alt" data-mv="-1" aria-label="Move up">&#9650;</button><button class="b alt" data-mv="1" aria-label="Move down">&#9660;</button></span>':'')+'</td><td><b>'+esc(c.last_name)+', '+esc(c.first_name)+'</b>'+(c.status==="Inactive"?' (inactive)':'')+'</td>'+(visits?"":'<td>'+esc(c.customer_id)+'</td>')+'<td>'+esc(c.service_day)+'</td>'+(visits?"":'<td>'+mapLink(c)+'</td><td class="r">'+money(c.amount_charged)+'</td>')+'<td>'+actions(c)+'</td></tr>';
  }).join(""),"Customers",visits?"visits-customers":"");
}
function flash(kind,text){if(text==="Obsolete view")return;var e=$("flash");if(e)e.innerHTML=text?'<div class="'+kind+'">'+esc(text)+'</div>':""}

async function api(path,opts){
  opts=opts||{};var h={"Content-Type":"application/json"},nav=S.nav,read=(!opts.method||opts.method==="GET"),controller=read?new AbortController():null;
  if(controller)(S.reads||(S.reads=new Set())).add(controller);
  if(controller&&opts.readKey){if(!S.readKeys)S.readKeys=new Map();var old=S.readKeys.get(opts.readKey);if(old)old.abort();S.readKeys.set(opts.readKey,controller)}
  if(S.token)h.Authorization="Bearer "+S.token;
  var r,data=null;
  try{
    r=await fetch(path,{method:opts.method||"GET",headers:h,signal:controller?controller.signal:undefined,body:opts.body!==undefined?JSON.stringify(opts.body):undefined});
    try{data=await r.json()}catch(e){}
  }catch(e){if(nav!==S.nav||(controller&&controller.signal.aborted))throw new Error("Obsolete view");throw e}
  finally{if(controller){S.reads.delete(controller);if(opts.readKey&&S.readKeys.get(opts.readKey)===controller)S.readKeys.delete(opts.readKey)}}
  if(nav!==S.nav||(controller&&controller.signal.aborted))throw new Error("Obsolete view");
  if(!r.ok){
    if(r.status===401&&S.token&&path.indexOf("/auth/")<0){signOut();throw new Error("Session expired. Please log in again.")}
    throw new Error((data&&data.error)||("Request failed ("+r.status+")"));
  }
  return data;
}
function cancelReads(){if(S.reads)S.reads.forEach(function(c){c.abort()});S.reads=new Set()}
function cancelReadKey(key){if(S.readKeys){var c=S.readKeys.get(key);if(c)c.abort()}}
function pagePath(path,offset,extra){return path+"?limit=50&offset="+(offset||0)+(extra||"")}
function pager(id,offset,total){return '<div class="row" aria-label="Record pages"><button class="b alt" id="'+id+'prev"'+(!offset?' disabled':'')+'>Previous</button><span role="status">'+(total?offset+1:0)+'–'+Math.min(offset+50,total)+' of '+total+'</span><button class="b alt" id="'+id+'next"'+(offset+50>=total?' disabled':'')+'>Next</button></div>'}
function bindPager(id,offset,total,load){$(id+"prev").onclick=function(){if(offset)load(Math.max(0,offset-50))};$(id+"next").onclick=function(){if(offset+50<total)load(offset+50)}}
async function allCustomers(extra,options){
  var rows=[],offset=0,page;
  do{page=await api(pagePath("/v1/customers",offset,extra),options);if(Array.isArray(page))return page;rows=rows.concat(page.rows);offset+=page.rows.length}while(page.rows.length&&offset<page.total);
  return rows;
}
function can(p){var a=S.account;if(!a)return false;if(a.role!=="EMPLOYEE")return true;return !!(a.permissions&&a.permissions[p])}
function isManager(){return S.account&&S.account.role!=="EMPLOYEE"}

/* ---------- dates (MM/dd/yyyy) ---------- */
function parseDate(s){
  var m=/^(\d{2})\/(\d{2})\/(\d{4})$/.exec((s||"").trim());if(!m)return null;
  var mo=+m[1],d=+m[2],y=+m[3],dt=new Date(y,mo-1,d);
  if(dt.getFullYear()!==y||dt.getMonth()!==mo-1||dt.getDate()!==d)return null;
  return dt;
}
function fmtDate(dt){return String(dt.getMonth()+1).padStart(2,"0")+"/"+String(dt.getDate()).padStart(2,"0")+"/"+dt.getFullYear()}
function dateInput(el){el.addEventListener("input",function(){
  var d=el.value.replace(/\D/g,"").slice(0,8),o=d;
  if(d.length>4)o=d.slice(0,2)+"/"+d.slice(2,4)+"/"+d.slice(4);else if(d.length>2)o=d.slice(0,2)+"/"+d.slice(2);
  el.value=o});el.setAttribute("inputmode","numeric");el.placeholder="MM/DD/YYYY";el.maxLength=10}
function cmpRecords(a,b){
  var da=parseDate(a.record_date),db=parseDate(b.record_date);
  if(da&&!db)return -1;if(!da&&db)return 1;
  if(da&&db&&da-db!==0)return da-db;
  var ca=a.amount>=0?0:1,cb=b.amount>=0?0:1;
  if(ca!==cb)return ca-cb;
  return a.record_id-b.record_id;
}

/* ---------- classification ---------- */
async function loadKw(){
  if(S.kw)return S.kw;var nav=S.nav,s={};
  if(can("canViewPdf")||isManager()){s=await api("/v1/settings")}
  if(nav!==S.nav)throw new Error("Obsolete view");
  S.kw={credit:kwList(s.recordTypeCreditKeywords||DEF_CREDIT),debit:kwList(s.recordTypeDebitKeywords||DEF_DEBIT),settings:s};
  return S.kw;
}
function kwList(v){return String(v).split(/[,\n]/).map(function(x){return x.trim().toLowerCase()}).filter(Boolean)}
function isCredit(type){
  var v=(type||"").trim().toLowerCase();if(!v||!S.kw)return false;
  return S.kw.credit.some(function(k){return v.indexOf(k)>=0});
}

/* ---------- favorites ---------- */
var VIEWS=[
 {id:"customers",label:"Customers",perm:function(){return can("canViewCustomers")||can("canViewCustomerDetails")}},
 {id:"visits",label:"Visits",perm:function(){return can("canAccessVisits")}},
 {id:"quotes",label:"Sales Quote",perm:function(){return can("canAccessSalesQuote")}},
 {id:"reader",label:"Statement Reader",perm:function(){return can("canAccessStatementReader")}},
 {id:"expenses",label:"Expenses",perm:function(){return can("canAccessExpenses")}},
 {id:"statements",label:"Statements",perm:function(){return can("canViewStatements")}},
 {id:"monthly",label:"Monthly Statement",perm:function(){return can("canEditStatements")&&can("canViewStatements")}},
 {id:"charged",label:"Charged Summary",perm:function(){return can("canViewStatements")}},
 {id:"revenue",label:"Revenue Summary",perm:function(){return can("canViewRevenueSummary")}},
 {id:"types",label:"Record Types",perm:function(){return can("canViewStatements")}},
 {id:"pdf",label:"PDF Settings",perm:function(){return can("canViewPdf")}},
 {id:"employees",label:"Employees",perm:function(){return isManager()}},
 {id:"backup",label:"Backup / Restore",perm:function(){return isManager()}}
];
function favKey(){var a=S.account||{};return "cm.fav."+a.username+"."+(a.companyId||0)}
function favs(){try{return JSON.parse(localStorage.getItem(favKey())||"[]")}catch(e){return[]}}
function toggleFav(id){var f=favs(),i=f.indexOf(id);if(i>=0)f.splice(i,1);else f.push(id);localStorage.setItem(favKey(),JSON.stringify(f));renderChrome()}

function renderChrome(){
  var on=!!S.token&&!S.master;
  document.body.classList.toggle("authed",!!S.token);
  $("menuBtn").classList.toggle("hide",!S.token);$("logout").classList.toggle("hide",!S.token);
  var nav=$("nav"),qk=$("quick");nav.innerHTML="";qk.innerHTML="";
  if(!S.token)return;
  $("drawer").classList.remove("open");
  if(S.master){
    nav.innerHTML='<div class="nv"><button class="go" data-go="companies">Companies</button></div>';
  }else{
    var fv=favs();
    VIEWS.filter(function(v){return v.perm()}).forEach(function(v){
      var d=document.createElement("div");d.className="nv";
      d.innerHTML='<button class="go" data-go="'+v.id+'">'+esc(v.label)+'</button><button class="star" data-star="'+v.id+'">'+(fv.indexOf(v.id)>=0?"\u2605":"\u2606")+'</button>';
      nav.appendChild(d);
    });
    if(S.account.role==="COMPANY"&&S.account.masterToken){var b=document.createElement("div");b.className="nv";b.innerHTML='<button class="go" data-go="backmaster">\u2190 Back to companies</button>';nav.appendChild(b)}
    fv.forEach(function(id){var v=VIEWS.filter(function(x){return x.id===id&&x.perm()})[0];if(!v)return;
      var b=document.createElement("button");b.textContent=v.label;b.setAttribute("data-go",id);qk.appendChild(b)});
  }
}
document.addEventListener("click",function(e){
  var t=e.target.closest("[data-go],[data-star]");
  if(t&&t.hasAttribute("data-star")){toggleFav(t.getAttribute("data-star"));$("drawer").classList.add("open");return}
  if(t&&t.hasAttribute("data-go")){
    var id=t.getAttribute("data-go");$("drawer").classList.remove("open");
    if(id==="backmaster")return backToMaster();
    go(id);return;
  }
  if(e.target.id==="drawer")$("drawer").classList.remove("open");
});
$("menuBtn").onclick=function(){$("drawer").classList.toggle("open")};
$("logout").onclick=function(){signOut()};

function clearTimers(){(S.timers||[]).forEach(function(t){clearInterval(t)});S.timers=[]}
function signOut(){clearTimers();cancelReads();S.nav=(S.nav||0)+1;S.token="";S.account=null;S.kw=null;S.master=false;localStorage.removeItem("cm.token");localStorage.removeItem("cm.account");localStorage.removeItem("cm.master");renderChrome();showLogin()}
function backToMaster(){
  var m=JSON.parse(localStorage.getItem("cm.master")||"null");if(!m)return signOut();
  S.token=m.token;S.account=m.account;S.master=true;S.kw=null;localStorage.setItem("cm.token",S.token);localStorage.setItem("cm.account",JSON.stringify(S.account));
  renderChrome();go("companies");
}
function go(view,arg){

function quoteTerms(c){

    "I hope you're doing well! I wanted to let you know that in order to move forward with your order, we kindly require payment in advance for the items requested. This helps us ensure timely processing and secure the necessary materials for your service.\n\n"+

function quoteValidate(q){
  if(!parseDate(q.quote_date))throw new Error("Quote date must be a valid MM/DD/YYYY date.");
  if(typeof q.notes!=="string"||q.notes.length>16000||typeof q.terms!=="string"||q.terms.length>16000)throw new Error("Notes and terms must be at most 16000 characters.");
  if(!Array.isArray(q.lines)||!q.lines.length||q.lines.length>200)throw new Error("Enter between 1 and 200 lines.");
  return {quote_date:q.quote_date,notes:q.notes,terms:q.terms,lines:q.lines.map(function(l,i){
    if(!parseDate(l.date))throw new Error("Line "+(i+1)+": use a valid MM/DD/YYYY date.");
    if(!String(l.type||"").trim())throw new Error("Line "+(i+1)+": choose a record type.");
    var raw=String(l.amount).trim();
    if(!/^-?\d+(\.\d{1,2})?$/.test(raw)||!Number(raw)||Math.abs(Number(raw))>999999999.99)throw new Error("Line "+(i+1)+": enter a nonzero amount up to 999999999.99, with at most 2 decimals.");
    return {date:l.date,type:l.type,description:String(l.description||""),amount:isCredit(l.type)?Math.abs(Number(raw)):-Math.abs(Number(raw))};
  })};
}

async function vMonthly(){
  var nav=S.nav;await loadKw();if(nav!==S.nav)return;

  if(nav!==S.nav)return;

   (types.length?'<label>Credit type</label><select id="mt">'+types.map(function(t){return "<option>"+esc(t)+"</option>"}).join("")+'</select><label for="md">Posting date</label><input id="md"><button class="b ok" id="go" style="margin-top:12px">Apply to active customers</button>':'<p class="neg">No credit record types exist. Add one under Record Types first.</p>')+'</div>';
  if(!$("go"))return;
  var now=new Date(),request=null,busy=false,completed=false;dateInput($("md"));$("md").value=fmtDate(new Date(now.getFullYear(),now.getMonth()+1,0));
  function pendingKey(){return "cm.monthly.pending."+JSON.stringify([S.account.companyId||0,S.account.username||"",S.account.role,$("md").value,$("mt").value])}
  function pending(value){
    try{if(typeof localStorage==="undefined")return null;if(value===null){localStorage.removeItem(pendingKey());return null}if(value){localStorage.setItem(pendingKey(),JSON.stringify(value));return value}
      var saved=JSON.parse(localStorage.getItem(pendingKey())||"null");return saved&&/^[a-f0-9-]{36}$/i.test(saved.request_id)?saved:null;
    }catch(e){return null}
  }
  function reset(){if(busy)return;request=pending();completed=false;$("go").disabled=false;$("go").textContent=request?"Retry same billing request":"Apply to active customers";
    if(request)flash("msg","An unconfirmed billing request is pending for this date and type. Retry uses the same request ID; no records are added automatically.");
  }
  $("mt").onchange=reset;$("md").addEventListener("input",reset);
  reset();
  $("go").onclick=async function(){
    if(busy)return;var date=$("md").value,type=$("mt").value;
    if(!parseDate(date))return flash("err","Date must be a valid MM/DD/YYYY date.");
    date=fmtDate(parseDate(date));$("md").value=date;
    if(!request)request=pending();
    if(!confirm((request?"Retry the SAME billing request? ":completed?"Create ANOTHER billing request? This intentionally bills customers again. ":"")+"Add a "+type+" record dated "+date+" to accessible active customers?"))return;
    if(!request)request={request_id:crypto.randomUUID(),date:date,type:type};
    pending(request);
    busy=true;$("go").disabled=true;$("mt").disabled=true;$("md").disabled=true;
    try{var result=await api("/v1/statements/monthly",{method:"POST",body:{request_id:request.request_id,date:request.date,type:request.type}});pending(null);request=null;completed=true;flash("msg","Added "+result.added+" records. Confirmed complete. Applying again creates a new billing request.")}
    catch(e){if(nav===S.nav)flash("err",e.message+" Retry manually with the same request; do not change the date or type.")}
    finally{busy=false;if(nav===S.nav){$("go").disabled=false;$("go").textContent=request?"Retry same billing request":completed?"Apply again (new request)":"Apply to active customers";$("mt").disabled=false;$("md").disabled=false}}
  };
}

var V_PH=["7.0","7.2","7.4","7.6","7.8","8.0"],V_CHLO=["1-2","2-4","3-6","5-10","7.5-15","10-20"],V_STB=["100","90","80","70","60","50","40","30"];
var V_COLORS={ph:["#e6a079","#ef866e","#df645e","#d9576b","#cf4778","#c83f80"],chlo:["#d9a09b","#e88898","#df536e","#ee4275","#e82d73","#ec1b70"]};
var V_MAX_INT=2147483647,V_MAX_NOTES=16000,V_MAX_PHOTO=600000,V_PHOTO_DIM=1280;
var V_PHOTO_RE=/^data:image\/(png|jpeg);base64,[A-Za-z0-9+\/]+={0,2}$/;
function visitPhotoError(s){
  if(s==null||s==="")return "";
  if(typeof s!=="string"||!V_PHOTO_RE.test(s))return "Photo must be a PNG or JPEG image.";
  if(s.length>V_MAX_PHOTO)return "Photo is too large (limit "+V_MAX_PHOTO+" characters).";
  return "";
}
function visitScale(w,h,max){var r=Math.min(1,max/Math.max(w,h));return {w:Math.max(1,Math.round(w*r)),h:Math.max(1,Math.round(h*r))}}
/* encode(w,h,quality) returns a data URL; shrinks quality, then dimensions, until it fits */
function visitFitPhoto(w,h,encode){
  var dim=visitScale(w,h,V_PHOTO_DIM);
  for(var step=0;step<8;step++){
    for(var q=0.85;q>=0.3;q-=0.15){
      var out=encode(dim.w,dim.h,q);
      if(typeof out==="string"&&out.length<=V_MAX_PHOTO)return {data:out};
    }
    dim={w:Math.max(1,Math.round(dim.w*0.75)),h:Math.max(1,Math.round(dim.h*0.75))};
  }
  return {error:"Could not shrink the photo under the size limit. Try a different photo."};
}
function visitInt(raw,name,optional){
  var s=String(raw==null?"":raw).trim();
  if(!s){return optional?{value:null}:{error:name+" is required."}}
  if(!/^[+-]?(\d+\.?\d*|\.\d+)([eE][+-]?\d+)?$/.test(s))return {error:name+" must be a number."};
  if(s.charAt(0)==="-")return {error:name+" cannot be negative."};
  if(/[.eE]/.test(s))return {error:name+" must be a whole number with no decimals."};
  if(!/^\d+$/.test(s))return {error:name+" must contain digits only."};
  var d=s.replace(/^0+/,"");
  if(!d)return {error:name+" must be greater than zero."};
  if(d.length>10||Number(d)>V_MAX_INT)return {error:name+" must be at most "+V_MAX_INT+"."};
  return {value:Number(d)};
}
function visitValidate(f){
  var a=visitInt(f.alk,"ALK",true);if(a.error)return a;
  var c=visitInt(f.cal,"CAL",true);if(c.error)return c;
  var pe=visitPhotoError(f.photo_data);if(pe)return {error:pe};
  var n=String(f.notes==null?"":f.notes);
  if(n.length>V_MAX_NOTES)return {error:"Notes must be "+V_MAX_NOTES+" characters or fewer."};
  if(V_PH.indexOf(f.ph)<0||V_CHLO.indexOf(f.chlo)<0||V_STB.indexOf(f.stb)<0)return {error:"Choose a valid PH, CHLO and STB."};
  return {body:{ph:f.ph,chlo:f.chlo,stb:f.stb,alk:a.value,cal:c.value,notes:n,photo_data:f.photo_data||""}};
}
var V_DEFAULT={ph:"7.4",chlo:"3-6",stb:"50"};
function visitRowError(v){
  if(!v||typeof v!=="object")return "Saved visit is invalid.";
  if(V_PH.indexOf(v.ph)<0)return "Saved visit has an invalid PH reading ("+v.ph+").";
  if(V_CHLO.indexOf(v.chlo)<0)return "Saved visit has an invalid CHLO reading ("+v.chlo+").";
  if(V_STB.indexOf(v.stb)<0)return "Saved visit has an invalid STB reading ("+v.stb+").";
  var a=visitInt(v.alk,"Saved ALK",true);if(a.error)return a.error;
  var c=visitInt(v.cal,"Saved CAL",true);if(c.error)return c.error;
  var pe=visitPhotoError(v.photo_data);if(pe)return "Saved visit photo is invalid. "+pe;
  if(v.notes!=null&&typeof v.notes!=="string")return "Saved visit has invalid notes.";
  return "";
}
function visitSort(list){
  return list.slice().sort(function(a,b){var ta=Date.parse(a.visited_at)||0,tb=Date.parse(b.visited_at)||0;return tb-ta||Number(b.visit_id)-Number(a.visit_id)});
}
function visitReadPhoto(file){
  return new Promise(function(resolve,reject){
    var url=URL.createObjectURL(file),img=new Image();
    img.onload=function(){
      URL.revokeObjectURL(url);
      var w=img.naturalWidth,h=img.naturalHeight;
      if(!w||!h)return reject(new Error("Could not read that image."));
      var cv=document.createElement("canvas"),ctx=cv.getContext("2d");
      var r=visitFitPhoto(w,h,function(cw,ch,q){cv.width=cw;cv.height=ch;ctx.fillStyle="#fff";ctx.fillRect(0,0,cw,ch);ctx.drawImage(img,0,0,cw,ch);return cv.toDataURL("image/jpeg",q)});
      if(r.error)return reject(new Error(r.error));
      resolve(r.data);
    };
    img.onerror=function(){URL.revokeObjectURL(url);reject(new Error("Could not read that image. Choose a PNG or JPEG photo."))};
    img.src=url;
  });
}

      var row=sel?await api(base+"/"+encodeURIComponent(sel),{method:"PUT",body:r.body}):await api(base,{method:"POST",body:r.body});
      if(nav!==S.nav)return;
      var badRow=visitRowError(row);if(badRow)throw new Error("Visit was saved but the server returned an invalid record. "+badRow);
      if(!sel)offset=0;sel=String(row.visit_id);fill(row);
      var page=await api(pagePath(path,offset,"&summary=1"));if(nav!==S.nav)return;
      visits=visitSort(Array.isArray(page)?page:page.rows);total=Array.isArray(page)?visits.length:page.total;
      opts();fill(row);flash("msg","Visit saved.");
    }catch(e){if(nav===S.nav)flash("err",e.message)}
    finally{saving=false;if(nav===S.nav)syncBusy()}
  };
  opts();fill(null);
}
/* ---------- backup ---------- */
function vBackup(){
  var nav=S.nav;
  app.innerHTML='<div id="flash"></div><div class="card"><h2>Backup / Restore</h2><p class="s">Backup copies only this company\'s data. Restore replaces this company\'s data with the backup file; other companies are not touched.</p>'+
   '<button class="b" id="bk">Download backup</button><label>Restore from file</label><input type="file" id="rf" accept=".json,application/json"><button class="b bad" id="rs">Restore</button></div>';
  $("bk").onclick=async function(){try{
    var d=await api("/v1/backup"),blob=new Blob([JSON.stringify(d)],{type:"application/json"}),a=document.createElement("a");
    a.href=URL.createObjectURL(blob);a.download="backup-"+(S.account.companyName||"company").replace(/\W+/g,"_")+"-"+fmtDate(new Date()).replace(/\//g,"-")+".json";document.body.appendChild(a);a.click();a.remove();
    flash("msg","Backup downloaded.")}catch(e){flash("err",e.message)}};
  $("rs").onclick=async function(){var f=$("rf").files[0];if(!f)return flash("err","Choose a backup file first.");
    if(!confirm("Replace ALL of this company's current data with the backup?"))return;
    try{var body=JSON.parse(await f.text());if(nav!==S.nav)return;await api("/v1/backup/restore",{method:"POST",body:body});flash("msg","Restore complete.")}catch(e){if(nav===S.nav)flash("err",e.message)}};
}

/* ---------- boot ---------- */
if(S.token&&S.account){start()}else{showLogin()}
</script>
