# SMTP email configuration. Set username to the mailbox email and password to
# its app password. The host is detected from Gmail, Outlook, Yahoo, iCloud,
# and Proton Mail sender addresses. Other providers use the Gmail-compatible
# fallback below unless an explicit mail.smtp.host is configured.
mail.smtp.host=auto
mail.smtp.fallback.host=smtp.gmail.com
mail.smtp.port=587
mail.smtp.username=your-email@example.com
mail.smtp.password=your-app-password
mail.smtp.auth=true
mail.smtp.starttls.enable=true
mail.from=your-email@example.com
email.enabled=true

# Twilio SMS configuration
twilio.accountSid=
twilio.authToken=
twilio.fromNumber=
sms.enabled=true
