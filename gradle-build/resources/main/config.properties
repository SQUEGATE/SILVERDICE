# SMTP email configuration. Set username to the mailbox email and password to
# its app password. The host and username are automatically detected from the account's
# sender email address if set to auto or left unconfigured.
mail.smtp.host=auto
mail.smtp.fallback.host=smtp.gmail.com
mail.smtp.port=587
mail.smtp.username=auto
mail.smtp.password=your-app-password
mail.smtp.auth=true
mail.smtp.starttls.enable=true
mail.from=your-email@example.com
email.enabled=true

# Twilio SMS configuration
twilio.accountSid=
twilio.authToken=
twilio.fromNumber=
sms.enabled=true
